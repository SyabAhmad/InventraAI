<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InventraAI — Chat</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <div>
        <div class="brand-name">InventraAI</div>
        <div class="brand-sub">Inventory Agent</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item active" href="chat.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sub">Ask about stock, sales, forecasts</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Agent Chat</h1>
      <span class="badge" id="model-badge"></span>
    </header>

    <div class="chat-layout">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-thread" id="chat-thread">
          <div class="chat-empty" id="chat-empty">
            <h2>Inventory Assistant</h2>
            <p>Ask about stock levels, low-stock items, sales, or demand forecasts.</p>
          </div>
        </div>
      </div>

      <div class="chat-composer">
        <div class="chat-hints">
          <button class="chat-hint" data-q="Show inventory summary">Inventory summary</button>
          <button class="chat-hint" data-q="Which products are low in stock?">Low stock</button>
          <button class="chat-hint" data-q="Which products are out of stock?">Out of stock</button>
          <button class="chat-hint" data-q="What are the top sellers?">Top sellers</button>
          <button class="chat-hint" data-q="Forecast demand for SKU-0001">Forecast SKU-0001</button>
          <button class="chat-hint" data-q="How many units of SKU-0002 are available?">Stock of SKU-0002</button>
        </div>
        <div class="chat-composer-inner">
          <textarea id="chat-input" rows="1" placeholder="Ask a question..."></textarea>
          <button class="chat-send" id="chat-send" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>
<script src="js/data.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
